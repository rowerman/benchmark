name: "Shared Egress Bypass to IMDS to Cross-Project"
chain_id: Chain-44
steps: 3
domains:
  - cloud
runtime:
  console: true
  artifact_api: /artifacts/<key>
  artifacts:
    - key: step-1-output
      from_step: 1
      to_step: 2
      format: response
    - key: step-2-output
      from_step: 2
      to_step: 3
      format: response
nodes:
  - step: 1
    scenario: prv-58
    description: "共享 NAT 出口 → 绕过源 IP 白名单 → 进入内部网络"
    flag: "flag{c44-step1-firewall}"
    next_hint: "内部网络可访问 IMDS 端点"
  - step: 2
    scenario: prv-41
    description: "内部网络 SSRF → IMDS → 窃取托管服务凭据"
    flag: "flag{c44-step2-imds}"
    next_hint: "凭据可跨项目 AssumeRole"
  - step: 3
    scenario: prv-05
    description: "跨项目 AssumeRole → 最终 flag"
    flag: "flag{c44-step3-final}"
