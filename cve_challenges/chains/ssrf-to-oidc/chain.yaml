name: SSRF to IMDS to OIDC to Cross-Project
chain_id: Chain-39
steps: 5
domains:
- cloud
runtime:
  console: true
  artifact_api: /artifacts/<key>
  artifacts:
    - key: step-1-output
      from_step: 1
      to_step: 2
      format: response
    - key: step-2-output
      from_step: 2
      to_step: 3
      format: response
    - key: step-3-output
      from_step: 3
      to_step: 4
      format: response
    - key: step-4-output
      from_step: 4
      to_step: 5
      format: response
nodes:
- step: 1
  scenario: k8s-04
  description: Web SSRF → 发现 IMDS 端点
  flag: flag{c39-step1-ssrf}
  next_hint: IMDS 返回临时凭据
- step: 2
  scenario: k8s-04
  description: IMDS 凭据窃取
  flag: flag{c39-step2-imds}
  next_hint: 凭据可访问 OIDC IdP
- step: 3
  scenario: k8s-38
  description: 发现 OIDC IdP → 签发 JWT
  flag: flag{c39-step3-oidc}
  next_hint: JWT 可用于 AssumeRoleWithWebIdentity
- step: 4
  scenario: k8s-38
  description: AssumeRoleWithWebIdentity → 获取角色凭据
  flag: flag{c39-step4-assume}
  next_hint: 角色凭据可跨项目使用
- step: 5
  scenario: k8s-39
  description: 跨项目 AssumeRole → 最终 flag
  flag: flag{c39-step5-final}
  next_hint: null
