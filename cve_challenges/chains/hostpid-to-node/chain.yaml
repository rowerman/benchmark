name: "hostPID to Node Control"
domains:
- k8s
difficulty: L2
steps: 2
description: >
  Two-step K8s chain. A pod has hostPID enabled but appears locked down
  (no privileged mode, capabilities dropped). hostPID alone exposes the host
  filesystem via /proc/1/root, leaking node-level flags.

nodes:
  - step: 1
    scenario: k8s-23
    name: "hostPID ProcFS Host Filesystem Read"
    technique: hostPID /proc escape
    description: >
      Pod with hostPID:true but no privileged mode. Access /proc/1/root to
      read the host flag at /host-flag/flag.txt.
    flag: flag{chain25-step1-hostpid}
    flag_location: "/host-flag/flag.txt on the KIND node (via /proc/1/root)"

  - step: 2
    name: "Node Final Flag"
    technique: Host filesystem read
    description: >
      Read the final node flag at /etc/chain25_final_flag through the same
      hostPID /proc view.
    flag: flag{chain25-step2-escape-final}
    flag_location: "/etc/chain25_final_flag on the KIND node"
