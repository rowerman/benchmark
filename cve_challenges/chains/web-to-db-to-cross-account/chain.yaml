name: "Web RCE to Managed DB Escape to IMDS to Cross-Account"
chain_id: Chain-42
steps: 5
domains:
  - web
  - cloud
runtime:
  console: true
  artifact_api: /artifacts/<key>
  artifacts:
    - key: step-1-output
      from_step: 1
      to_step: 2
      format: response
    - key: step-2-output
      from_step: 2
      to_step: 3
      format: response
    - key: step-3-output
      from_step: 3
      to_step: 4
      format: response
    - key: step-4-output
      from_step: 4
      to_step: 5
      format: response
nodes:
  - step: 1
    scenario: web-03
    description: "WordPress 文件上传 RCE → 获取 Web Shell"
    flag: "flag{c42-step1-web}"
    next_hint: "Web Shell 中发现数据库连接配置"
  - step: 2
    scenario: db-01
    description: "PostgreSQL 弱口令 → 数据库访问"
    flag: "flag{c42-step2-db}"
    next_hint: "数据库是托管引擎且带供应商补丁缺陷"
  - step: 3
    scenario: cloud-16
    description: "引擎补丁 → 索引函数以供应商角色执行 → 宿主 RCE"
    flag: "flag{c42-step3-escape}"
    next_hint: "从宿主可访问 IMDS 端点"
  - step: 4
    scenario: cloud-01
    description: "SSRF → IMDS → 窃取 IAM 临时凭据"
    flag: "flag{c42-step4-imds}"
    next_hint: "凭据可调用 STS AssumeRole 跨账号"
  - step: 5
    scenario: cloud-09
    description: "跨账号 AssumeRole → 获取最终 flag"
    flag: "flag{c42-step5-final}"
