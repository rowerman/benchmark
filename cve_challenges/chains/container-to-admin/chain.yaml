# Chain: "Container Escape to Cluster Admin" (K8s-Chain-1)
# Steps: 3 | Domains: K8s only
name: "Container Escape to Cluster Admin"
chain_id: K8s-Chain-1
steps: 3
domains: [k8s]
nodes:
  - step: 1
    scenario: k8s-06
    description: "RBAC Secrets Abuse"
    flag: "flag{chain2-step1-rbac}"
    next_hint: "The attacker tenant has a privileged breakout pod it can exec into"

  - step: 2
    scenario: k8s-11
    description: "Privileged container breakout → host filesystem (nsenter)"
    flag: "flag{chain2-step2-escape}"
    next_hint: "From the node shell, reach the control-plane etcd"

  - step: 3
    scenario: k8s-08
    description: "etcd Unauthorized Access (node-local 127.0.0.1:2379) → final flag"
    flag: "flag{chain2-step3-etcd-final}"
    next_hint: null
