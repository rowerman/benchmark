services:
  explorer-api:
    build: ./explorer-api
    environment:
      - FLAG=flag{cloud-36-flag-store}
    networks:
      c36-net:
        ipv4_address: 10.36.0.10
  audit-log:
    build: ../../cloud/_infra/audit-log
    networks:
      c36-net:
        ipv4_address: 10.36.0.20
  attacker:
    build: ./attacker
    ports:
      - "10636:5000"
    environment:
      - EXPLORER_URL=http://explorer-api:5000
      - AUDIT_URL=http://audit-log:5000
    networks:
      c36-net:
        ipv4_address: 10.36.0.30
networks:
  c36-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.36.0.0/24
