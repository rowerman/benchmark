# Cloud service identity manifest.
# Single source of truth for nmap fingerprinting of public cloud-sim entries.
# `probe`: http-root | http-health | http-marker | xml | header | standard | manual
#   - http-*: nmap GET on the listed path then content/header match
#   - xml:    protocol-style XML response match
#   - header: stable Server/banner header match
#   - standard: system nmap probes already identify the wire protocol
#   - manual: aux endpoint exercised by black-box tests; not gated by nmap check

main:
  - id: cloud-01
    port: 10601
    archetype: ec2-console
    product: Cloud Dashboard (SSRF to IMDS)
    probe: http-root
    marker: Cloud Dashboard
