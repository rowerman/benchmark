taxonomy_version: 3
scenario_prefix:
  stable: prv
  uppercase: PRV

first_level_boundaries:
  A:
    code: control_plane_request_processing
    label_zh: 控制面请求处理边界
    label_en: Control-plane request-processing boundary
    scenario_range: {start: 1, end: 12}
    mechanisms:
      A1:
        label_zh: Kubernetes RBAC 越权
        label_en: Kubernetes RBAC privilege escalation
        scenarios: [prv-01, prv-02, prv-03]
      A2:
        label_zh: 准入链配置劫持
        label_en: Admission-chain configuration hijacking
        scenarios: [prv-04]
      A3:
        label_zh: 云身份信任策略滥用
        label_en: Cloud identity trust-policy abuse
        scenarios: [prv-05]
      A4:
        label_zh: 联邦身份断言伪造
        label_en: Federated identity assertion forgery
        scenarios: [prv-06]
      A5:
        label_zh: 控制面策略执行路径不一致
        label_en: Control-plane policy-enforcement path inconsistency
        scenarios: [prv-07]
      A6:
        label_zh: 控制面服务认证缺失
        label_en: Missing control-plane service authentication
        scenarios: [prv-08, prv-09]
      A7:
        label_zh: 控制面输入注入
        label_en: Control-plane input injection
        scenarios: [prv-10, prv-11, prv-12]

  B:
    code: workload_node_runtime
    label_zh: 工作负载—节点运行时边界
    label_en: Workload-node runtime boundary
    scenario_range: {start: 13, end: 25}
    mechanisms:
      B1:
        label_zh: 容器运行时实现漏洞
        label_en: Container-runtime implementation vulnerability
        scenarios: [prv-13]
      B2:
        label_zh: 宿主路径与符号链接越界
        label_en: Host-path and symbolic-link escape
        scenarios: [prv-14, prv-15]
      B3:
        label_zh: 危险工作负载隔离配置
        label_en: Dangerous workload isolation configuration
        scenarios: [prv-16, prv-17, prv-18, prv-19]
      B4:
        label_zh: 运行时控制接口暴露
        label_en: Runtime control-interface exposure
        scenarios: [prv-20, prv-21]
      B5:
        label_zh: 节点可信接口或凭据滥用
        label_en: Node trust-interface or credential abuse
        scenarios: [prv-22, prv-23]
      B6:
        label_zh: 节点侧可信内容替换
        label_en: Node-side trusted-content replacement
        scenarios: [prv-24]
      B7:
        label_zh: 不可信工作负载代码执行
        label_en: Untrusted workload code execution
        scenarios: [prv-25]

  C:
    code: workload_reachability_placement
    label_zh: 工作负载可达与放置边界
    label_en: Workload reachability and placement boundary
    scenario_range: {start: 26, end: 32}
    mechanisms:
      C1:
        label_zh: 网络路径与地址操纵
        label_en: Network-path and address manipulation
        scenarios: [prv-26, prv-27, prv-28, prv-29]
      C2:
        label_zh: 网络策略选择器欺骗
        label_en: Network-policy selector spoofing
        scenarios: [prv-30]
      C3:
        label_zh: 调度约束绕过
        label_en: Scheduling-constraint bypass
        scenarios: [prv-31, prv-32]

  D:
    code: managed_platform_tenant
    label_zh: 托管平台租户边界
    label_en: Managed-platform tenant boundary
    scenario_range: {start: 33, end: 37}
    mechanisms:
      D1:
        label_zh: 托管数据库文件系统越界
        label_en: Managed-database filesystem escape
        scenarios: [prv-33]
      D2:
        label_zh: 托管数据库宿主执行
        label_en: Managed-database host execution
        scenarios: [prv-34]
      D3:
        label_zh: 共享运行时隔离缺陷
        label_en: Shared-runtime isolation defect
        scenarios: [prv-35]
      D4:
        label_zh: 平台控制面租户作用域缺失
        label_en: Missing platform-control-plane tenant scope
        scenarios: [prv-36]
      D5:
        label_zh: 托管自动化持久化
        label_en: Managed-automation persistence
        scenarios: [prv-37]

  E:
    code: cloud_native_supply_chain_trust
    label_zh: 云原生供应链信任边界
    label_en: Cloud-native supply-chain trust boundary
    scenario_range: {start: 38, end: 40}
    mechanisms:
      E1:
        label_zh: 镜像仓库写入与可变引用
        label_en: Registry write and mutable image reference
        scenarios: [prv-38, prv-39]
      E2:
        label_zh: 共享构建链滥用
        label_en: Shared build-chain abuse
        scenarios: [prv-40]

