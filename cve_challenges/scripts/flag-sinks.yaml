seeds:
  cloud-13:
  - command: 'set -e

      read -r f

      sed -i "s|^flag=.*|flag=$f|" /rdsdbdata/config/grover_volume.conf

      grep -q "$f" /rdsdbdata/config/grover_volume.conf

      '
    flag: CVE_FLAG1
    service: db
  cloud-16:
  - command: 'set -e

      read -r f

      psql -U postgres -d victim_db -c "TRUNCATE flags; INSERT INTO flags VALUES (''$f'');"

      '
    flag: CVE_FLAG
    service: victim-pg
  cloud-29:
  - command: 'set -e

      read -r f

      printf ''%s'' "$f" > /app/workspaces/tenant-b/secret.txt

      '
    flag: CVE_FLAG
    service: shared-executor
