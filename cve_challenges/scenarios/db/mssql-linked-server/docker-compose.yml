# MSSQL Linked Server scenario — 双 MSSQL 实例，low 可访问 target 的 linked server
# TCP 端口通过 socat + Compose 端口映射转发，兼容 Docker Desktop。
services:
  mssql-low:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123!"
      CVE_FLAG: ${CVE_FLAG:-flag{db-04-default}}
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/1433' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      db-net:
        ipv4_address: 192.168.101.10

  mssql-target:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123!"
      CVE_FLAG: ${CVE_FLAG:-flag{db-04-default}}
    volumes:
      - ./flag.txt:/flag.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/1433' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      db-net:
        ipv4_address: 192.168.101.11

  db-proxy:
    image: alpine:latest
    container_name: mssql-linked-proxy
    ports:
      - "10204:10204"
      - "10214:10214"
    networks:
      - db-net
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache socat >/dev/null 2>&1
        echo "[db-proxy] MSSQL TCP forwards..."
        socat TCP-LISTEN:10204,reuseaddr,fork TCP:mssql-low:1433 &
        socat TCP-LISTEN:10214,reuseaddr,fork TCP:mssql-target:1433 &
        wait
    healthcheck:
      test: ["CMD-SHELL", "pgrep socat || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - mssql-low
      - mssql-target

networks:
  db-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.101.0/24
