services:
  pkg-registry:
    build: ./pkg-registry
    networks:
      c37-net:
        ipv4_address: 10.37.0.10
    ports:
      - "10726:5000"
  composer-pipeline:
    build:
      context: ./composer-pipeline
    ports:
      - "10637:5000"
    environment:
      - REGISTRY_URL=http://pkg-registry:5000
      - WORKER_TOKEN=composer-worker-token
      - RESOURCE_URL=http://victim-resource:5000
    networks:
      c37-net:
        ipv4_address: 10.37.0.20
  victim-resource:
    build: ./victim-resource
    volumes:
      - ../../../infra/cloud/vault-client/vault_client.py:/app/vault_client.py:ro
    networks:
      c37-net:
        ipv4_address: 10.37.0.40
  flag-vault:
    build:
      context: ../../../infra/cloud/flag-vault
    environment:
      VAULT_SCENARIO: cloud-26
      VAULT_MODE: network-source
      VAULT_FLAG_FILE: /vault/flag
      VAULT_CONFIG: '{"cidrs":["10.37.0.40/32"],"hint":"平台密钥库只对托管数据平台工作负载地址开放"}'
    networks:
      c37-net:
  attacker:
    profiles: [debug]
    build: ./attacker
    environment:
      - REGISTRY_URL=http://pkg-registry:5000
      - PIPELINE_URL=http://composer-pipeline:5000
    networks:
      c37-net:
        ipv4_address: 10.37.0.30
networks:
  c37-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.37.0.0/24
