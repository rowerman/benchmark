services:
  attacker:
    profiles: [debug]
    build:
      context: ./attacker
    environment:
      - CI_URL=http://ci-runner:5000
      - GIT_URL=http://git-server:5000
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  ci-runner:
    build: ./ci-runner
    environment:
      - GIT_URL=http://git-server:5000
      - CLOUD_RESOURCE_URL=http://cloud-resource:5000
      - WORKLOAD_TOKEN=ci-workload-token
    ports:
      - "10608:5000"
    volumes:
      - ../../../infra/cloud/vault-client/vault_client.py:/app/vault_client.py:ro
    depends_on:
      - cloud-resource
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  cloud-resource:
    build: ./cloud-resource
    volumes:
      - ../../../infra/cloud/vault-client/vault_client.py:/app/vault_client.py:ro

  # flag 唯一终点：只认流水线工作负载令牌（CI runner 与云资源服务共用）
  flag-vault:
    build:
      context: ../../../infra/cloud/flag-vault
    environment:
      VAULT_SCENARIO: cloud-05
      VAULT_MODE: header-secret
      VAULT_FLAG_FILE: /vault/flag
      VAULT_CONFIG: '{"header":"X-Workload-Token","values":["ci-workload-token"],"hint":"流水线身份令牌"}'

  git-server:
    build: ./git-server
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
