services:
  attacker:
    profiles: [debug]
    build:
      context: ./attacker
    environment:
      - IAM_URL=http://iam:5000
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  iam:
    build:
      context: ../../../infra/cloud/iam-trust
    ports:
      - "10612:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # flag 唯一终点：三段式临时凭据要向 iam-trust 反查会话与角色
  flag-vault:
    build:
      context: ../../../infra/cloud/flag-vault
    environment:
      VAULT_SCENARIO: cloud-08
      VAULT_MODE: session-creds
      VAULT_FLAG_FILE: /vault/flag
      VAULT_IAM_URL: http://iam:5000
      VAULT_CONFIG: '{"roles":["CrossAccountRole"],"hint":"STS session credentials from the cross-account role"}'

  # socat proxies — expose internal services to host for nmap detection
  iam-proxy:
    image: alpine/socat:latest
    command: "TCP-LISTEN:10702,fork,reuseaddr TCP:iam:5000"
    depends_on:
      iam:
        condition: service_healthy

  s3-proxy:
    image: alpine/socat:latest
    ports:
      - "10704:10704"
    command: "TCP-LISTEN:10704,fork,reuseaddr TCP:s3:5000"
    depends_on:
      - s3

  s3:
    build: ./s3
    environment:
      - IAM_URL=http://iam:5000
    ports:
      - "10708:5000"
    volumes:
      - ../../../infra/cloud/vault-client/vault_client.py:/app/vault_client.py:ro
    depends_on:
      - iam
