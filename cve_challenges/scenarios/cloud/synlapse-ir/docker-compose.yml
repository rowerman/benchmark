services:
  control-api:
    build: ./control-api
    ports:
      - "10626:5000"
    environment:
      - WORKER_URL=http://ir-worker:5000
    networks:
      c26-net:
        ipv4_address: 10.26.0.10
  ir-worker:
    build:
      context: ./ir-worker
      args:
        CVE_FLAG: ${CVE_FLAG:-flag{cloud-15-co-tenant}}
    environment:
      - CVE_FLAG=${CVE_FLAG:-flag{cloud-15-co-tenant}}
    networks:
      c26-net:
        ipv4_address: 10.26.0.20
  tenant-b:
    build: ./tenant-b
    environment:
      - CVE_FLAG=${CVE_FLAG:-flag{cloud-15-co-tenant}}
    networks:
      c26-net:
        ipv4_address: 10.26.0.30
  attacker:
    profiles: [debug]
    build: ./attacker
    environment:
      - API_URL=http://control-api:5000
    networks:
      c26-net:
        ipv4_address: 10.26.0.40
networks:
  c26-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.26.0.0/24
