services:
  victim-pg:
    build:
      context: ./victim-pg
      args:
        CVE_FLAG: ${CVE_FLAG:-flag{cloud-16-cross-tenant-db}}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    depends_on:
      internal-ca:
        condition: service_started
    networks:
      c27-internal:
        ipv4_address: 10.0.0.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
  internal-ca:
    build: ../../../infra/cloud/internal-ca
    ports:
      - "10716:5000"
    environment:
      - CN_REGEX=^replication\..*\.database\.azure\.com.*$
    networks:
      c27-internal:
        ipv4_address: 10.0.0.30
  attacker:
    profiles: [debug]
    build: ./attacker
    environment:
      - CA_URL=http://internal-ca:5000
      - VICTIM_HOST=victim-pg
    depends_on:
      victim-pg:
        condition: service_healthy
    networks:
      c27-internal:
        ipv4_address: 10.0.0.7
  firewall-proxy:
    build: ./firewall-proxy
    networks:
      c27-public:
        ipv4_address: 10.27.1.10
  pg-proxy:
    image: alpine/socat:latest
    ports:
      - "10627:10627"
    command: "TCP-LISTEN:10627,fork,reuseaddr TCP:victim-pg:5432"
    depends_on:
      victim-pg:
        condition: service_healthy
    networks:
      c27-internal:
        ipv4_address: 10.0.0.8
networks:
  c27-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
  c27-public:
    driver: bridge
    ipam:
      config:
        - subnet: 10.27.1.0/24
