services:
  gateway:
    build:
      context: ./gateway
    ports:
      - "10604:5000"
    environment:
      - LAMBDA_URL=http://lambda:5000/run
    networks:
      - cloud-net
    depends_on:
      - lambda
      - iam
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  lambda:
    build:
      context: ./lambda
    environment:
      - IAM_ACCESS_KEY_ID=AKIALAMBDAEXAMPLE
      - IAM_SECRET_KEY=lambda-iam-secret-key
    volumes:
      - ../../../infra/cloud/vault-client/vault_client.py:/app/vault_client.py:ro
    networks:
      - cloud-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  iam:
    build:
      context: ../../../infra/cloud/iam-trust
    environment:
      - IAM_ROLES_FILE=/app/roles/default.yaml
      - IAM_CREDENTIAL_TTL=3600
    networks:
      - cloud-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # socat proxies — expose internal services to host for nmap detection
  iam-proxy:
    image: alpine/socat:latest
    command: "TCP-LISTEN:10702,fork,reuseaddr TCP:iam:5000"
    networks:
      - cloud-net
    depends_on:
      iam:
        condition: service_healthy

  # flag 唯一终点：只认 Lambda 执行角色凭据的 SigV4 签名
  flag-vault:
    build:
      context: ../../../infra/cloud/flag-vault
    environment:
      VAULT_SCENARIO: cloud-03
      VAULT_MODE: sigv4
      VAULT_FLAG_FILE: /vault/flag
      VAULT_CONFIG: '{"access_key":"AKIALAMBDAEXAMPLE","secret_key":"lambda-iam-secret-key","hint":"SigV4 with the Lambda execution role credentials"}'
    networks:
      - cloud-net

networks:
  cloud-net:
    driver: bridge
