services:
  attacker:
    profiles: [debug]
    build:
      context: ./attacker
    environment:
      - IDP_URL=http://saml-idp:5000
      - IAM_URL=http://iam:5000
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  saml-idp:
    build: ./saml-idp
    ports:
      - "10613:5000"

  # socat proxies — expose internal services to host for nmap detection
  saml-proxy:
    image: alpine/socat:latest
    ports:
      - "10707:10707"
    command: "TCP-LISTEN:10707,fork,reuseaddr TCP:saml-idp:5000"
    depends_on:
      - saml-idp

  iam-proxy:
    image: alpine/socat:latest
    command: "TCP-LISTEN:10702,fork,reuseaddr TCP:iam:5000"
    depends_on:
      - iam

  iam:
    build:
      context: ../../../infra/cloud/iam-trust
    environment:
      - IAM_ROLES_FILE=/app/roles/default.yaml
      - OIDC_JWKS_URL=http://saml-idp:5000/.well-known/jwks.json
    ports:
      - "10709:5000"
    volumes:
      - ../../../infra/cloud/vault-client/vault_client.py:/app/vault_client.py:ro

  # flag 唯一终点：校验伪造的 SAML 断言（IdP 的 RS256 签名 + iss/aud/sub）
  flag-vault:
    build:
      context: ../../../infra/cloud/flag-vault
    environment:
      VAULT_SCENARIO: cloud-09
      VAULT_MODE: jwt
      VAULT_FLAG_FILE: /vault/flag
      VAULT_CONFIG: '{"jwks_url":"http://saml-idp:5000/.well-known/jwks.json","issuer":"corp-idp.example.com","audience":"https://signin.aws.amazon.com/saml","claims":{"sub":"admin@corp"},"hint":"SAML assertion signed by the federation IdP key"}'
