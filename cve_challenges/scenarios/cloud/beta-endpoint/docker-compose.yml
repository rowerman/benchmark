services:
  console:
    build: ./console
    environment:
      - API_CREDENTIAL=valid-sigv4
    ports:
      - "10727:5000"
    networks:
      c35-net:
        ipv4_address: 10.35.0.10
  prod-api:
    build: ./prod-api
    environment:
      - AUDIT_URL=http://audit-log:5000
      - API_CREDENTIAL=valid-sigv4
    ports:
      - "10729:5000"
    networks:
      c35-net:
        ipv4_address: 10.35.0.20
  beta-api:
    build: ./beta-api
    environment:
      - API_CREDENTIAL=valid-sigv4
    ports:
      - "10635:5000"
    volumes:
      - ../../../infra/cloud/vault-client/vault_client.py:/app/vault_client.py:ro
    networks:
      c35-net:
        ipv4_address: 10.35.0.30
  flag-vault:
    build:
      context: ../../../infra/cloud/flag-vault
    environment:
      VAULT_SCENARIO: cloud-24
      VAULT_MODE: network-source
      VAULT_FLAG_FILE: /vault/flag
      VAULT_CONFIG: '{"cidrs":["10.35.0.30/32"],"hint":"只交付给服务目录 beta 端点"}'
    networks:
      c35-net:
  audit-log:
    build: ../../../infra/cloud/audit-log
    ports:
      - "10728:5000"
    networks:
      c35-net:
        ipv4_address: 10.35.0.40
  attacker:
    profiles: [debug]
    build: ./attacker
    environment:
      - CONSOLE_URL=http://console:5000
      - PROD_URL=http://prod-api:5000
      - BETA_URL=http://beta-api:5000
      - AUDIT_URL=http://audit-log:5000
    networks:
      c35-net:
        ipv4_address: 10.35.0.50
networks:
  c35-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.35.0.0/24
