services:
  build-worker:
    build: ./build-worker
    environment:
      - BUILD_SECRET=build-fleet-internal-secret
    ports:
      - "10629:5000"
    networks:
      c29-net:
        ipv4_address: 10.29.0.10
  internal-registry:
    build: ./internal-registry
    environment:
      - VICTIM_IMAGE=echo 'victim app running'; id
    ports:
      - "10718:5000"
    networks:
      c29-net:
        ipv4_address: 10.29.0.20
  tenant-puller:
    build:
      context: ./tenant-puller
      args:
        CVE_FLAG: ${CVE_FLAG:-flag{cloud-18-victim-image}}
    environment:
      - REGISTRY_URL=http://internal-registry:5000
      - IMAGE_NAME=victim-app:latest
    ports:
      - "10719:5000"
    networks:
      c29-net:
        ipv4_address: 10.29.0.30
  attacker:
    profiles: [debug]
    build: ./attacker
    environment:
      - BUILD_URL=http://build-worker:5000
      - REGISTRY_URL=http://internal-registry:5000
      - PULLER_URL=http://tenant-puller:5000
    networks:
      c29-net:
        ipv4_address: 10.29.0.40
networks:
  c29-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.29.0.0/24
