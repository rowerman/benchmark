services:
  host-agent:
    build: ../../../infra/cloud/host-agent
    ports:
      - "10628:5000"
    environment:
      - BOOTSTRAP_SCRIPT=TLS_BOOTSTRAP_TOKEN=token-abcdef
    volumes:
      - ../../../infra/cloud/vault-client/vault_client.py:/app/vault_client.py:ro
    networks:
      c28-net:
        ipv4_address: 168.63.129.16
  control-plane:
    build: ./control-plane
    environment:
      - BOOTSTRAP_TOKEN=token-abcdef
    ports:
      - "10722:5000"
    volumes:
      - ../../../infra/cloud/vault-client/vault_client.py:/app/vault_client.py:ro
    networks:
      c28-net:
        ipv4_address: 168.63.129.20
  flag-vault:
    build:
      context: ../../../infra/cloud/flag-vault
    environment:
      VAULT_SCENARIO: cloud-17
      VAULT_MODE: network-source
      VAULT_FLAG_FILE: /vault/flag
      VAULT_FLAG2_FILE: /vault/flag2
      VAULT_CONFIG: '{"cidrs":["168.63.129.16/32","168.63.129.20/32"],"hint":"节点引导密文只对 Wireserver 与控制面地址开放"}'
    networks:
      c28-net:
  node:
    build: ./node
    networks:
      c28-net:
        ipv4_address: 168.63.129.30
  attacker:
    profiles: [debug]
    build: ./attacker
    environment:
      - HOST_AGENT_URL=http://168.63.129.16:5000
      - CONTROL_URL=http://control-plane:5000
    depends_on:
      - host-agent
      - control-plane
    networks:
      c28-net:
        ipv4_address: 168.63.129.40
networks:
  c28-net:
    driver: bridge
    ipam:
      config:
        - subnet: 168.63.129.0/24
