services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: cloudsqladmin
      POSTGRES_PASSWORD: provider-super
      POSTGRES_DB: clouddb
    networks:
      c25-net:
        ipv4_address: 10.25.0.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudsqluser"]
      interval: 10s
      timeout: 5s
      retries: 10
  console:
    build: ./console
    ports:
      - "10625:5000"
    environment:
      - DB_URL=postgresql://cloudsqluser:customer-password@db:5432/clouddb
      - SUPER_URL=postgresql://cloudsqladmin:provider-super@db:5432/clouddb
    depends_on:
      db:
        condition: service_healthy
    networks:
      c25-net:
        ipv4_address: 10.25.0.10
networks:
  c25-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.25.0.0/24
