services:
  shared-executor:
    build:
      context: ./shared-executor
      args:
        CVE_FLAG: ${CVE_FLAG:-flag{cloud-29-cross-tenant-workspace}}
    networks:
      c40-net:
        ipv4_address: 10.40.0.10
  dataform-api:
    build: ./dataform-api
    ports:
      - "10640:5000"
    environment:
      - EXECUTOR_URL=http://shared-executor:5000
    networks:
      c40-net:
        ipv4_address: 10.40.0.20
  attacker:
    profiles: [debug]
    build: ./attacker
    environment:
      - API_URL=http://dataform-api:5000
    networks:
      c40-net:
        ipv4_address: 10.40.0.30
networks:
  c40-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.40.0.0/24
