services:
  attacker:
    profiles: [debug]
    build:
      context: ./attacker
      args:
        CVE_FLAG: ${CVE_FLAG:-flag{cloud-10-default}}
    environment:
      - FLAG=${CVE_FLAG:-flag{cloud-10-default}}
      - IAM_URL=http://iam:5000
  iam:
    build:
      context: ../../../infra/cloud/iam-trust
    environment:
      - FLAG=${CVE_FLAG:-flag{cloud-10-default}}
    ports:
      - "10615:5000"

  # socat proxy — expose IAM/STS to host for nmap detection
  iam-proxy:
    image: alpine/socat:latest
    command: "TCP-LISTEN:10702,fork,reuseaddr TCP:iam:5000"
    depends_on:
      - iam
