services:
  console:
    build:
      context: ./console
      args:
        CVE_FLAG: ${CVE_FLAG:-flag{cloud-04-default}}
    ports:
      - "10605:5000"
    environment:
      - FLAG=${CVE_FLAG:-flag{cloud-04-default}}
      - PARSER_URL=http://parser:5000
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  parser:
    build:
      context: ./parser
      args:
        CVE_FLAG: ${CVE_FLAG:-flag{cloud-04-default}}
    environment:
      - FLAG=${CVE_FLAG:-flag{cloud-04-default}}
      - SSM_URL=http://ssm:5000
      - EXECUTION_ROLE_TOKEN=stack-execution-role
    depends_on:
      - ssm
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  ssm:
    build: ./ssm
    environment:
      - FLAG=${CVE_FLAG:-flag{cloud-04-default}}
