services:
  console:
    build:
      context: ./console
    environment:
      - PARSER_URL=http://parser:5000
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  parser:
    build:
      context: ./parser
    environment:
      - SSM_URL=http://ssm:5000
      - EXECUTION_ROLE_TOKEN=stack-execution-role
    ports:
      - "10605:5000"
    depends_on:
      - ssm
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  ssm:
    build: ./ssm
    volumes:
      - ../../../infra/cloud/vault-client/vault_client.py:/app/vault_client.py:ro

  # flag 唯一终点：SSM 出示内部执行角色令牌才交付
  flag-vault:
    build:
      context: ../../../infra/cloud/flag-vault
    environment:
      VAULT_SCENARIO: cloud-04
      VAULT_MODE: header-secret
      VAULT_FLAG_FILE: /vault/flag
      VAULT_CONFIG: '{"header":"X-Execution-Role","values":["stack-execution-role"],"hint":"SSM 以内部执行角色令牌换取 /secure/flag"}'
