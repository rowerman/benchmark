services:
  explorer-api:
    build: ./explorer-api
    ports:
      - "10636:5000"
    environment:
      - FLAG=${CVE_FLAG:-flag{cloud-25-flag-store}}
      - RESOURCE_READER_ARN=arn:aws:iam::111122223333:user/attacker
    networks:
      c36-net:
        ipv4_address: 10.36.0.10
  audit-log:
    build: ../../../infra/cloud/audit-log
    ports:
      - "10725:5000"
    networks:
      c36-net:
        ipv4_address: 10.36.0.20
  attacker:
    profiles: [debug]
    build: ./attacker
    environment:
      - EXPLORER_URL=http://explorer-api:5000
      - AUDIT_URL=http://audit-log:5000
    networks:
      c36-net:
        ipv4_address: 10.36.0.30
networks:
  c36-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.36.0.0/24
