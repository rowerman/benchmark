services:
  db:
    build:
      context: ./db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clouddb
    networks:
      c24-net:
        ipv4_address: 10.24.0.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
  console:
    build: ./console
    ports:
      - "10624:5000"
    environment:
      - DB_URL=postgresql://postgres:postgres@db:5432/clouddb
      - INTERNAL_TOKEN=grover-internal-credential-token
    volumes:
      - ../../../infra/cloud/vault-client/vault_client.py:/app/vault_client.py:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      c24-net:
        ipv4_address: 10.24.0.10
  internal-api:
    build: ./internal-api
    environment:
      - INTERNAL_TOKEN=grover-internal-credential-token
    volumes:
      - ../../../infra/cloud/vault-client/vault_client.py:/app/vault_client.py:ro
    networks:
      c24-net:
        ipv4_address: 10.24.0.30
  flag-vault:
    build:
      context: ../../../infra/cloud/flag-vault
    environment:
      VAULT_SCENARIO: cloud-13
      VAULT_MODE: header-secret
      VAULT_FLAG_FILE: /vault/flag
      VAULT_FLAG2_FILE: /vault/flag2
      VAULT_CONFIG: '{"header":"Authorization","values":["Bearer grover-internal-credential-token"],"hint":"供应商内部凭据才能读懂宿主机文件指向的密文"}'
    networks:
      c24-net:
networks:
  c24-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.24.0.0/24
