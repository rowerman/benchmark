services:
  credential-vault:
    build: ./credential-vault
    environment:
      - VAULT_TOKEN=vault-token-abc
      - INITIAL_SECRET=secret-v1
    networks:
      c42-net:
        ipv4_address: 10.42.0.10
  victim-resource:
    build: ./victim-resource
    volumes:
      - ../../../infra/cloud/vault-client/vault_client.py:/app/vault_client.py:ro
    networks:
      c42-net:
        ipv4_address: 10.42.0.20
  flag-vault:
    build:
      context: ../../../infra/cloud/flag-vault
    environment:
      VAULT_SCENARIO: cloud-31
      VAULT_MODE: network-source
      VAULT_FLAG_FILE: /vault/flag
      VAULT_CONFIG: '{"cidrs":["10.42.0.20/32"],"hint":"受保护资源只对平台内网地址交付"}'
    networks:
      c42-net:
  automation-service:
    build: ./automation-service
    ports:
      - "10642:5000"
    environment:
      - VAULT_URL=http://credential-vault:5000
      - VAULT_TOKEN=vault-token-abc
      - VICTIM_URL=http://victim-resource:5000
    networks:
      c42-net:
        ipv4_address: 10.42.0.30
  attacker:
    profiles: [debug]
    build: ./attacker
    environment:
      - AUTOMATION_URL=http://automation-service:5000
      - VAULT_URL=http://credential-vault:5000
      - VICTIM_URL=http://victim-resource:5000
      - VAULT_TOKEN=vault-token-abc
    networks:
      c42-net:
        ipv4_address: 10.42.0.40
networks:
  c42-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.42.0.0/24
